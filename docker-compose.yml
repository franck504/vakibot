services:
  vakibot-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vakibot-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - CHROMA_PERSIST_DIR=/app/storage/chroma
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./storage/chroma:/app/storage/chroma
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:1.5.9
    container_name: vakibot-chroma
    ports:
      - "8001:8000"
    volumes:
      - ./storage/chroma-server:/chroma/chroma
    restart: unless-stopped
